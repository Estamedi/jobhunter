server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The app is not for search indexing; marketing lives on applyladder.com.
    # (add_header is not inherited into locations that set their own, so it is
    # repeated in each one.)
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Missing files (robots.txt, sitemap.xml, stale assets...) must 404, not
    # return the SPA shell with a 200.
    location ~* \.(txt|xml|json|map|ico|png|jpe?g|gif|svg|webp|avif|js|css|woff2?)$ {
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri =404;
    }

    # Ensure social crawlers and browsers pick up metadata changes quickly.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location = /robots.txt {
        try_files $uri =404;
    }

    location /images/ {
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
